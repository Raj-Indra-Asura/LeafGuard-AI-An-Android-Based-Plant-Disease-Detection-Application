name: Validate application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    name: Android (${{ matrix.track }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        track: [android-app-kotlin, android-app]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Validate, lint, and package
        working-directory: ${{ matrix.track }}
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Upload Kotlin beta APK
        if: matrix.track == 'android-app-kotlin'
        uses: actions/upload-artifact@v4
        with:
          name: leafguard-kotlin-debug-apk
          path: android-app-kotlin/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  backend:
    name: Backend API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend-api/requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r backend-api/requirements-dev.txt
      - name: Compile and test
        working-directory: backend-api
        run: |
          python -m compileall -q .
          python -m unittest -v test_api.py
